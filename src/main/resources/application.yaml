spring:
  application:
    name: api

  datasource:
    url: jdbc:postgresql://localhost:5432/soccerapi
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  logging:
    level:
      liquibase: DEBUG